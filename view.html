<!DOCTYPE html><html><head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 10px; margin: 0; color: #1e293b; }
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 6px solid #94a3b8; }
    .card.confirmed { border-left-color: #22c55e; }
    .cust-name { font-size: 1.1rem; font-weight: bold; margin: 2px 0; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; color: white; margin-bottom: 5px; }
    .bg-std { background: #4f46e5; } .bg-saf { background: #ea580c; } .bg-gen { background: #059669; }
    .note-box { background: #fefce8; border: 1px solid #fef3c7; padding: 8px; border-radius: 6px; font-size: 0.8rem; color: #854d0e; margin-top: 8px; }
    .date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .date-item { background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .date-label { font-size: 0.65rem; color: #94a3b8; }
  </style></head><body>
  <header style="display:flex; justify-content:space-between; align-items:center; padding:10px;"><h3>📡 状況確認</h3><button onclick="window.top.location.replace('<?= scriptUrl ?>')" style="padding:6px 12px; border:none; background:#f1f5f9; border-radius:5px; font-weight:bold;">戻る</button></header>
  <select id="shopSelect" onchange="refresh()" style="width:100%; padding:12px; border-radius:8px; border:2px solid #2563eb; margin-bottom:15px; font-size:1rem;"><option value="">店舗を選択してください</option><option value="車検課">車検課</option><option value="板橋ss">板橋ss</option><option value="志村ss">志村ss</option><option value="小茂根ss">小茂根ss</option><option value="赤羽西ss">赤羽西ss</option><option value="東坂下ss">東坂下ss</option><option value="高島平ss">高島平ss</option><option value="武蔵関ss">武蔵関ss</option></select>
  <div id="content"></div><script>
  function getBadge(c) { let cls = c.includes('スタンダード') ? 'bg-std' : (c.includes('セーフティー') ? 'bg-saf' : 'bg-gen'); return `<span class="badge ${cls}">${c}</span>`; }
  function refresh() {
    const s = document.getElementById('shopSelect').value; if(!s) return;
    google.script.run.withSuccessHandler(res => {
      let h = '<h4 style="color:#64748b; margin:20px 0 10px;">📩 承認待ち</h4>';
      res.pending.forEach(d => { 
        h += `<div class="card"><div class="cust-name">${d.name} 様</div><small>${d.car} / ${d.num}</small><br>${getBadge(d.course)}<div class="date-grid"><div class="date-item"><div class="date-label">第一希望日</div><b>${d.date1}</b></div><div class="date-item"><div class="date-label">第二希望日</div><b>${d.date2 || '-'}</b></div></div>${d.note?`<div class="note-box">${d.note}</div>`:''}</div>`; 
      });
      h += '<h4 style="color:#22c55e; margin:25px 0 10px;">✅ 確定済み</h4>';
      res.confirmed.forEach(d => { 
        h += `<div class="card confirmed"><div class="cust-name">${d.name} 様</div><small>${d.car} / ${d.num}</small><br>${getBadge(d.course)}<div class="date-grid"><div class="date-item"><div class="date-label">通検日</div><b>${d.confirmedDate}</b></div><div class="date-item"><div class="date-label">入庫日</div><b>${d.entryDate}</b></div></div>${d.note?`<div class="note-box">${d.note}</div>`:''}</div>`; 
      });
      document.getElementById('content').innerHTML = h;
    }).getShopStatusData(s);
  }</script></body></html>
